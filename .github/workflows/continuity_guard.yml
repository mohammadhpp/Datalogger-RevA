name: Datalogger source continuity

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check required sources and provenance
        run: python3 AI_SCRIPTS/Continuity/check_source_continuity.py
