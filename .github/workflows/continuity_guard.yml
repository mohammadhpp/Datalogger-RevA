name: Datalogger source continuity

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '23 6 * * 1'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check sources and live historical Release assets
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 AI_SCRIPTS/Continuity/check_source_continuity.py --verify-release
